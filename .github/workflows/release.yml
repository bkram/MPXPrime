name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # SDR helper (mpx-tuner) build + bundle deps. cmake is preinstalled on the
      # runner; these provide librtlsdr + liquid-dsp (+ libusb + fftw) so
      # build-release.sh builds and bundles the helper into MPX Prime Meter.app.
      # Without them the bundling step skips and the DMG ships without SDR.
      - name: Install SDR build deps
        run: brew install librtlsdr liquid-dsp

      - name: Build Release (Universal Binary)
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ./build-release.sh "$VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            macOS/dist/MPX_Prime-*.dmg
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: ubuntu-24.04
          - runner: ubuntu-26.04
            label: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    # Ubuntu 26.04 is allowed to fail until Swift.org ships a 26.04 toolchain
    # (swiftly currently reports "Unsupported Linux platform" there). The leg
    # auto-activates once support lands; until then the release still ships
    # the 24.04 deb (static Swift stdlib -- installs and runs on 26.04 too)
    # and the macOS DMG. fail-fast:false keeps 24.04 independent.
    continue-on-error: ${{ matrix.label == 'ubuntu-26.04' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential curl pkg-config binutils             libcurl4-openssl-dev libedit2 libpython3-dev libsqlite3-0             libxml2-dev libz3-dev tzdata unzip zlib1g-dev libasound2-dev

      - name: Install Swift (swiftly)
        run: |
          curl -sO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --assume-yes latest
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          swift --version

      - name: Build (release, static Swift stdlib)
        run: |
          swift build --package-path macOS -c release --product MPXPrime             --static-swift-stdlib
          macOS/.build/release/MPXPrime --verify --seconds 5

      - name: Build .deb package
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ./build-deb.sh "$VERSION" "${{ matrix.label }}"
          sha256sum mpxprime_*_amd64.deb > "mpxprime_${VERSION}-${{ matrix.label }}.sha256"

      - name: Smoke-install the package
        run: |
          sudo dpkg -i mpxprime_*_amd64.deb
          mpxprime --verify --seconds 5
          systemctl cat mpxprime >/dev/null

      - name: Attach to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mpxprime_*_amd64.deb
            mpxprime_*.sha256
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
