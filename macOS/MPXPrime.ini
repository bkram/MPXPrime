; Sample default configuration. Mirrors the in-code defaults from
; AppConfig.swift; safe to copy to ~/Library/Application Support/MPX Prime/MPX Prime.ini
; and use as a starting point. Numerics are research-grounded against
; Orban / Stereo Tool / Omnia factory presets — see plan.md "Positioning"
; for the amateur-grade-target rationale.

[MPX]
pilot_level = 0.08
sum_level = 1.0
diff_level = 1.0
mono_mode = False
; Processing chain ON by default. Set True only to A/B against the bypass
; signal; commercial processors never ship bypassed.
processing_bypass = False
; Pre-emphasis: 50 us = EU/world default; 75 us = USA/Canada/South Korea.
preemphasis_us = 50
program_lowpass_hz = 16000.0
input_gain_db = 0.0
output_gain_db = 0.0
final_drive_db = 6.0
final_stage_preset_id = balanced
; Top-level "Station Format" profile that atomically applies a coherent
; bundle of multiband / final-stage / PrimeBass / widener / composite-
; clipper settings per music format. Picking a profile via the GUI
; overwrites all of these together. The profile ID itself is a cosmetic
; label after application — the actual chain state lives in the
; individual per-stage keys.
;
; Valid IDs: community_radio (default), pop_ac, chr_top40, rock,
; edm_dance, urban_hiphop, jazz_classical, news_talk.
format_profile_id = community_radio
hpf_hz = 30.0
hf_trim_db = 0.0
hf_trim_hz = 4000.0
mpx_deviation_khz = 75.0
en_rds = True

; --- Wideband AGC ---
; Pop-Medium tuning: -14 LUFS target, 20 dB range, 6 ms attack, 1.5 s
; release (program-dependent up to 3x slower on busy program).
wideband_agc_enabled = True
wideband_agc_target_db = -14.0
wideband_agc_attack_ms = 6.0
wideband_agc_release_ms = 1500.0
wideband_agc_max_gain_db = 10.0
wideband_agc_min_gain_db = -10.0
wideband_agc_k_weighting = True
wideband_agc_release_program_dependent = True

; --- PrimeBass / Stereo widener ---
; Both off by default — these are coloring stages and pushing energy
; into L-R degrades fringe-listener SNR on low-power TX. Presets
; pre-selected so enabling is one INI flip.
primebass_enabled = False
primebass_preset_id = ac
primebass_amount = 0.18
primebass_freq_hz = 100.0
primebass_harmonics = 0.10
primebass_drive = 0.68
primebass_density = 0.36
primebass_subharmonics_enabled = False
primebass_subharmonics_amount = 0.20
stereo_widen_enabled = False
stereo_widen_width = 0.5
stereo_widen_center = 0.5
stereo_widen_mix = 1.0
mono_bass_enabled = True
mono_bass_freq_hz = 125.0

; --- Multiband compressor ---
; 5-band AC/Pop preset at "Light" intensity. Light intensity offsets
; thresholds by +1.5 dB, ratios x0.9, attack x1.2, release x1.15 vs
; the "normal" preset numerics — keeps it transparent at default.
multiband_enabled = True
multiband_mode = 5
multiband_preset_id = 5_ac
multiband_intensity = light
multiband_low_hz = 320.0
multiband_high_hz = 2550.0
multiband_x1_hz = 90.0
multiband_x2_hz = 350.0
multiband_x3_hz = 1800.0
multiband_x4_hz = 6800.0
multiband_low_threshold_db = -16.0
multiband_mid_threshold_db = -14.5
multiband_high_threshold_db = -13.0
multiband_low_ratio = 1.575
multiband_mid_ratio = 1.395
multiband_high_ratio = 1.152
multiband_low_attack_ms = 33.6
multiband_mid_attack_ms = 22.8
multiband_high_attack_ms = 15.6
multiband_low_release_ms = 431.0
multiband_mid_release_ms = 345.0
multiband_high_release_ms = 259.0
multiband_knee_db = 3.6
multiband_link_strength = 0.52
multiband_release_program_dependent = True
multiband_transient_aware_attack_enabled = False
multiband_inter_band_coupling_enabled = False
multiband_makeup_db = 0.0

; --- Audio-path clippers ---
; Bass clipper ON, gentle. Orban + Omnia run bass clipping in every
; factory preset — uncontrolled LF peaks waste 2-3 dB of total
; modulation budget on inaudible sub-content.
bass_clipper_enabled = True
bass_clipper_crossover_hz = 150.0
bass_clipper_threshold_db = -3.0
bass_clipper_drive = 1.5
; DC (broadband distortion-cancelled) clipper off by default — opt-in
; for operators wanting more loudness at the cost of harshness.
dc_clipper_enabled = False
dc_clipper_ceiling_db = -1.0
dc_clipper_cancel_freq_hz = 2000.0

; --- BS.412 power limiter ---
; OFF by default. Only EU stations need ITU-R BS.412 compliance;
; enabling it costs ~5 dB perceived loudness. Flip to True if your
; regulator requires it.
bs412_enabled = False
bs412_threshold_db = -10.0
bs412_window_seconds = 60.0

; --- Limiters and composite output ---
limit_mpx = True
limit_threshold = 0.98
limit_lookahead_enabled = True
limit_lookahead_ms = 5.0
pre_encode_limiter_enabled = True
pre_encode_threshold = 0.85
pre_encode_release_ms = 50.0
pre_encode_bandlimited_residual_enabled = False
; Band-limited residual ceiling kernel (only active when the master enable
; above is True). 33 / 0.25 is the 0.27 parameter-sweep-selected default.
; Tap count is forced odd and clamped 5-129; cutoff fraction is clamped
; 0.05-0.49 of the oversampled rate. Both live-applicable.
pre_encode_bandlimited_residual_taps = 33
pre_encode_bandlimited_residual_cutoff_fraction = 0.25
; Pre-encode limiter look-ahead in milliseconds. Default 1.0 ms = attack
; time x 4 (0.25 ms attack constant) — smoother gain ramp on HF transients
; (cymbals, sibilance, percussion edges) without audible squish. Set to 0
; for legacy feedback-only behavior. Clamped 0.0-5.0 ms. Restart-required
; (allocates delay buffers). See plan.md for the Phase 2 HF-subband
; variant (US 5,579,404, Dolby, expired).
pre_encode_lookahead_ms = 1.0
; Phase 2: HF-subband-aware look-ahead per US 5,579,404 / EP 0685130
; (Dolby, expired 2013). When True (default), the detector path
; high-passes input at `pre_encode_lookahead_hf_cutoff_hz` before
; computing the future peak, so the look-ahead engages only on HF
; transients (where pre-emphasis concentrates peaks) and leaves LF
; perceived loudness / punch untouched. Audio path stays full-band.
; Restart-required. Set to False for Phase 1 broadband detector.
pre_encode_lookahead_hf_only = True
pre_encode_lookahead_hf_cutoff_hz = 4000.0
encoder_fir_enabled = True
; Linear-phase FIR multiband crossovers (TX path only). Phase-flat band
; reconstruction prevents the transient smear / inter-band pumping that
; makes IIR LR4 multiband sound worse than single-band on percussive
; content. Convolution runs through vDSP_dotpr (SIMD/AMX) so the FIR
; path costs ~24% more than IIR. Adds ~5.3 ms latency at 192 kHz.
; Restart-required.
multiband_fir_enabled = True

; --- Composite clipper (16x default, additive distortion cancellation) ---
; ON with -1.0 / -0.3 thresholds — engages gently on peaks for ~1.5 dB
; perceived loudness lift. Additive distortion cancellation per Orban
; US 4,460,871 / 5,737,434 (expired) subtracts the bandpass-isolated
; clip residual from protected bands of the output.
mpx_clipper_enabled = True
mpx_clipper_threshold_db = -1.0
mpx_clipper_ceiling_db = -0.3
; cancel_audio = False keeps full clipping in the audio band, which is
; where peak reduction comes from. Set True to suppress audio-band
; clipping (rare; mostly useful for diagnostic A/B against the unclipped
; reference).
mpx_clipper_cancel_audio = False
; Stereo subcarrier 23-53 kHz: kept clean → preserves stereo separation.
mpx_clipper_cancel_stereo = True
; Pilot guard 17-21 kHz and RDS guard 55-59 kHz: kept clean so the
; post-stage 19 kHz pilot and 57 kHz RDS injection are not corrupted by
; clipper IM in those bands.
mpx_clipper_cancel_pilot = True
mpx_clipper_cancel_rds = True
mpx_clipper_lookahead_ms = 0.0
; Oversampling factor for the composite clipper soft-clip kernel. Valid:
; 8, 16, 32. Restart-required (rebuilds decimator FIR + interpolator).
;
;   16  (default) — Industry-standard oversampling, matches Optimod 8X00,
;        Omnia.11, and Stereotool's default. The clean choice for almost
;        every station. Decimation FIR runs at 3.072 MHz internal rate
;        (16 × 192 kHz host) which keeps clipping IM safely out of the
;        wanted bands across realistic drive levels. Use this unless you
;        have a specific reason to change it.
;
;   8   — Half the CPU cost of this stage. Sound-quality tradeoff is
;        small at amateur drive levels — at hot drives you give up about
;        6 dB of alias suppression vs 16x, which is measurable on a
;        spectrum analyzer but almost never audible on real program.
;        Pick 8 when the machine is genuinely short on CPU (older Intel
;        Macs, Pi-class hardware) — better a slightly less polished
;        clipper that runs glitch-free than a fancier one that drops
;        samples. Frees roughly 6 percentage points of real-time budget
;        on a typical machine.
;
;   32  — Twice the CPU cost of 16x. The improvement over 16x is real
;        but small: a further ~6 dB alias suppression, mostly visible
;        in measurement (Omnia.9-class spec-sheet number) rather than
;        audible. Pick this only if you have hardware headroom to spare
;        and want to defend the most stringent measurement gates, or
;        you're driving the clipper very hard on dense EDM / contemporary
;        pop where the last bit of aliasing might just barely matter.
;        Costs roughly 12 percentage points of real-time budget on a
;        typical machine — confirm CPU first.
mpx_clipper_oversampling = 16
; Experimental extra loudness stage: split audio composite into
; low/mid/high bands and clip them independently before pilot/RDS
; injection. Off by default until verifier/listening validation is done.
mpx_multiband_clipper_enabled = False

; Test tone generator (Test Tone tab in the GUI). Live-applicable —
; toggle source between live input and generated tone via the Test
; Tone tab's Enable switch (or by setting source_mode above to "tone"
; / "input"). type: sine | pink | white. mode: mono | stereo (L=−R) |
; left | right. Default level −20 dBFS matches broadcast line
; reference; tone enters the chain pre-AGC.
test_tone_mode = mono
test_tone_freq = 1000.0
test_tone_level_db = -20.0
test_tone_type = sine

[RDS]
; Replace pi, ps_*, rt_*, ptyn, ps_long_32 with your station identity
; before going on air. The values below are project defaults; pi=82FF
; is a documentation placeholder, not a real allocation.
en_rds = True
rds_level = 2.0
pi = 82FF
pty = 8
tp = False
ta = False
ms = True
di_stereo = True
di_head = False
di_comp = True
di_dyn = False
en_af = False
af_list = 88.1, 98.8, 106.6
af_method = A
ps_dynamic = 3s:Stereo- 3s:Fool 3s:MAC 3s:App 3s:FM 3s:MPX 3s:+RDS
ps_centered = True
rt_text = 10s:MPX Prime FM MPX Generator/10s:Native macOS Swift App
rt_manual_buffers = False
rt_cycle_ab = False
rt_a = MPX Prime: FM MPX + RDS Audio Processor
rt_b = MPX Prime: FM MPX Generator
rt_cr = True
rt_centered = False
rt_mode = 2A
rt_cycle = True
rt_cycle_time = 5.0
rt_active_buffer = 0
rt_ab_cycle_count = 2
ptyn = -STEREO-
en_ptyn = True
ptyn_centered = False
ps_long_32 = MPX Prime Stereo and RDS Coder
en_lps = True
lps_centered = False
lps_cr = True
en_rt_plus = False
rt_plus_format_a = {artist} - {title}
rt_plus_format_b = {artist} - {title}
ecc = E3
lic = 1D
tz_offset = 0.0
en_ct = True
en_id = True
auto_start = True
group_sequence = 0A 0A 2A 0A
scheduler_auto = True
scheduler_standard = True
scheduler_standard_lps = True
rds_gaussian_enabled = True
rds_gaussian_bw_hz = 2400.0
rds_gaussian_taps = 81

[INTERFACES]
; Device UIDs are platform-specific. Pick devices in the app's Settings
; tab; the app writes the resolved UIDs back into this file. Leaving the
; keys commented out lets the app fall back to system defaults.
source_mode = input
monitor_enabled = False
monitor_rate_hz = 192000.0
; blocksize controls callback granularity. 1024 @ 192 kHz = 5.3 ms block
; latency on the TX path. Smaller blocks = lower latency but more callbacks
; per second (more CPU overhead). Range 512–8192. 512 is the throughput-
; validated floor; below that the per-callback overhead dominates and
; AVAudioEngine HAL limits kick in on most devices.
blocksize = 1024
fft_window_92khz = False
; Dual-rate audio chain (Phase 2 cutover, default ON since 0.30). When
; True, the entire audio domain (multiband, AGC, EQ, image, pre-emphasis,
; pre-encode limiter) runs at `dual_rate_audio_domain_rate_hz` (48 kHz
; default) inside a polyphase Kaiser-windowed sinc resampler boundary,
; while the MPX domain (composite assembly, BS.412, composite clipper,
; pilot + RDS injection) stays at the engine's MPX rate. Saves ~42% of
; real-time on M1 Pro at 192 kHz with stereo separation preserved at the
; receiver. Bigger relative win on older Intel hardware (AVX2 with no
; AMX). Restart-required. Set to False to fall back to the legacy
; single-rate chain — only do that if you have a measured reason.
;
; Integer engine:audio ratios only (192/48 = 4, 96/48 = 2). Non-integer
; ratios (176.4/48, 128/48) silently fall back to the legacy single-rate
; chain at engine start regardless of this flag.
dual_rate_audio_domain_enabled = True
dual_rate_audio_domain_rate_hz = 48000.0
;input_device_uid =
;output_device_uid =
;monitor_device_uid =

[CONTROL]
; Remote-control REST API + web dashboard (see docs/manual.md "Remote
; control"). Disabled by default. Binding beyond 127.0.0.1 REQUIRES an
; API key; without one the server refuses to start remote-exposed.
control_enabled = False
control_bind = 127.0.0.1
control_port = 8737
control_api_key =
