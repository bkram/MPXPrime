<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPX Prime Studio</title>
<style>
  :root {
    --bg:#0e1216; --bar:#12181e; --panel:#171e25; --panel2:#1e2731; --line:#2a343f;
    --text:#d9e1e9; --dim:#8a97a4; --accent:#38b6ff; --ok:#35c46f; --warn:#e0a53c;
    --bad:#e05252; --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font:13px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; }
  #statusbar { background:var(--bar); border-bottom:1px solid var(--line); padding:9px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  #brand { display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:0.05em; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #meta { color:var(--dim); font-size:11px; }
  .strip { display:flex; gap:12px; align-items:flex-end; }
  .vm { width:42px; text-align:center; }
  .vm .track { height:40px; width:9px; margin:0 auto 3px; background:#0a0e12; border-radius:3px; position:relative; overflow:hidden; }
  .vm .fill { position:absolute; bottom:0; left:0; right:0; height:0; background:linear-gradient(0deg,#2f9e5f,#7ec843 70%,#e0a53c 88%,#e05252); }
  .vm.gr .fill { background:var(--warn); }
  .vm .cap { font-size:9px; color:var(--dim); letter-spacing:0.05em; }
  .vm .val { font-family:var(--mono); font-size:10px; }
  .bigread { text-align:center; min-width:78px; }
  .bigread b { font-family:var(--mono); font-size:20px; font-weight:500; display:block; line-height:1.1; }
  .bigread span { font-size:9px; color:var(--dim); letter-spacing:0.07em; }
  .bigread.alert b { color:var(--bad); }
  #transport { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .badge { font-size:10px; padding:2px 8px; border-radius:9px; border:1px solid var(--warn); color:var(--warn); }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 13px; font-size:12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06131c; font-weight:600; }
  button.danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600; }
  #main { display:flex; flex:1; min-height:0; }
  #sidebar { width:150px; background:var(--bar); border-right:1px solid var(--line); padding:10px 0; overflow-y:auto; flex-shrink:0; }
  #sidebar .nav { padding:7px 18px; cursor:pointer; color:var(--dim); font-size:13px; border-left:3px solid transparent; user-select:none; }
  #sidebar .nav:hover { color:var(--text); }
  #sidebar .nav.active { color:var(--text); border-left-color:var(--accent); background:rgba(56,182,255,0.06); }
  #content { flex:1; overflow-y:auto; padding:18px; }
  #content h1 { font-size:15px; margin-bottom:4px; }
  #content .pagehelp { color:var(--dim); font-size:12px; margin-bottom:14px; max-width:80ch; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; align-items:start; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 15px; }
  .card h2 { font-size:11px; letter-spacing:0.12em; color:var(--dim); text-transform:uppercase; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ctl { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid rgba(42,52,63,0.5); }
  .ctl:last-child { border-bottom:none; }
  .ctl label { flex:1; }
  .ctl .sub { display:block; color:var(--dim); font-size:10px; }
  .switch { position:relative; width:36px; height:20px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .knob { position:absolute; inset:0; background:#39434e; border-radius:10px; transition:background 120ms; cursor:pointer; }
  .knob:before { content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; transition:transform 120ms; }
  .switch input:checked + .knob { background:var(--ok); }
  .switch input:checked + .knob:before { transform:translateX(16px); }
  .sliderwrap { display:flex; align-items:center; gap:10px; flex:1.2; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .sval { font-family:var(--mono); font-size:12px; min-width:78px; text-align:right; }
  select,input[type=text],input[type=number],input[type=password] { background:#0a0e12; border:1px solid var(--line); color:var(--text); border-radius:6px; padding:5px 8px; font-family:var(--mono); font-size:12px; }
  select:focus,input:focus { border-color:var(--accent); outline:none; }
  input[type=text] { width:210px; }
  .rds-live { background:#0a0e12; border-radius:8px; padding:12px 14px; font-family:var(--mono); margin-bottom:10px; }
  .rds-live .ps { font-size:24px; letter-spacing:0.14em; color:var(--accent); }
  .rds-live .rt { font-size:12px; color:var(--dim); margin-top:5px; min-height:16px; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  td input { width:100%; }
  .section-title { color:var(--accent); font-family:var(--mono); padding:12px 0 4px; }
  .hint { color:var(--dim); font-size:11px; margin-top:8px; }
  #toast { position:fixed; right:16px; bottom:16px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 15px; font-size:12px; opacity:0; transition:opacity 200ms; pointer-events:none; max-width:48ch; z-index:10; }
  #toast.show { opacity:1; }
  #keybar { display:none; gap:8px; margin:12px 16px 0; align-items:center; background:var(--panel); border:1px solid var(--warn); border-radius:8px; padding:10px 14px; }
  #keybar.show { display:flex; }
</style>
</head>
<body>
<div id="statusbar">
  <div id="brand"><span class="dot" id="dot"></span>MPX PRIME<div id="meta">connecting...</div></div>
  <div class="strip">
    <div class="vm"><div class="track"><div class="fill" id="mInL"></div></div><div class="val" id="vInL">-</div><div class="cap">IN L</div></div>
    <div class="vm"><div class="track"><div class="fill" id="mInR"></div></div><div class="val" id="vInR">-</div><div class="cap">IN R</div></div>
    <div class="vm"><div class="track"><div class="fill" id="mOut"></div></div><div class="val" id="vOut">-</div><div class="cap">MPX</div></div>
    <div class="vm gr"><div class="track"><div class="fill" id="mAGC"></div></div><div class="val" id="vAGC">-</div><div class="cap">AGC</div></div>
    <div class="vm gr"><div class="track"><div class="fill" id="mLim"></div></div><div class="val" id="vLim">-</div><div class="cap">LIM</div></div>
    <div class="vm gr"><div class="track"><div class="fill" id="mClip"></div></div><div class="val" id="vClip">-</div><div class="cap">CLIP</div></div>
  </div>
  <div class="bigread" id="devRead"><b id="vDev">-</b><span>DEVIATION kHz</span></div>
  <div class="bigread"><b id="vPilot">-</b><span>PILOT %</span></div>
  <div class="bigread"><b id="vRDSInj">-</b><span>RDS %</span></div>
  <div class="bigread"><b id="vMargin">-</b><span>MARGIN dB</span></div>
  <div id="transport">
    <span class="badge" id="restartBadge" hidden>restart pending</span>
    <button class="primary" id="btnStart">Start</button>
    <button id="btnRestart">Restart</button>
    <button class="danger" id="btnStop">Stop</button>
  </div>
</div>
<div id="keybar">
  <span>API key required:</span>
  <input type="password" id="keyInput" placeholder="paste API key" style="flex:1">
  <button class="primary" id="keySave">Unlock</button>
</div>
<div id="main">
  <nav id="sidebar"></nav>
  <div id="content"></div>
</div>
<div id="toast"></div>

      {title:"Input / Core", keys:["source_mode","input_gain_db","hpf_hz","program_lowpass_hz","hf_trim_hz","hf_trim_db","preemphasis_us","mono_mode","processing_bypass"]},
      {title:"Phase Rotator", keys:["phase_rotation_enabled","phase_rotation_freq_hz"]},
      {title:"AGC", keys:["wideband_agc_enabled","wideband_agc_target_db","wideband_agc_attack_ms","wideband_agc_release_ms","wideband_agc_max_gain_db","wideband_agc_min_gain_db","wideband_agc_k_weighting","wideband_agc_release_program_dependent","wideband_agc_bass_desensitize"]},
      {title:"Parametric EQ", keys:["parametric_eq_enabled","peq_b1_freq_hz","peq_b1_gain_db","peq_b2_freq_hz","peq_b2_gain_db","peq_b2_q","peq_b3_freq_hz","peq_b3_gain_db","peq_b3_q","peq_b4_freq_hz","peq_b4_gain_db"]},
      {title:"Multiband", presetKind:"multiband", keys:["multiband_enabled","multiband_mode","multiband_low_threshold_db","multiband_low_ratio","multiband_mid_threshold_db","multiband_mid_ratio","multiband_high_threshold_db","multiband_high_ratio","multiband_makeup_db","multiband_knee_db","multiband_link_strength","multiband_release_program_dependent","multiband_transient_aware_attack_enabled","multiband_inter_band_coupling_enabled","multiband_fir_enabled"]},
      {title:"Expander", keys:["downward_expander_enabled","expander_threshold_db","expander_ratio","expander_attack_ms","expander_release_ms"]},
      {title:"Multiband Limiter", keys:["multiband_limiter_enabled","multiband_limiter_threshold_db","multiband_limiter_attack_ms","multiband_limiter_release_ms"]},
      {title:"Stereo Image", presetKind:"widener", keys:["stereo_widen_enabled","stereo_widen_width","stereo_widen_center","stereo_widen_mix","mono_bass_enabled","mono_bass_freq_hz"]},
      {title:"PrimeBass", presetKind:"primebass", keys:["primebass_enabled","primebass_amount","primebass_freq_hz","primebass_harmonics","primebass_drive","primebass_density","primebass_subharmonics_enabled","primebass_subharmonics_amount"]},
      {title:"Bass Clipper", keys:["bass_clipper_enabled","bass_clipper_crossover_hz","bass_clipper_threshold_db","bass_clipper_drive"]},
      {title:"Audio Clipper", keys:["dc_clipper_enabled","dc_clipper_ceiling_db"]},
      {title:"HF Clipper", keys:["hf_clipper_enabled","hf_clipper_crossover_hz","hf_clipper_threshold_db","hf_clipper_drive"]},
      {title:"Audio Limiter", keys:["pre_encode_limiter_enabled","pre_encode_threshold","pre_encode_release_ms","limit_lookahead_enabled","limit_lookahead_ms","pre_encode_bandlimited_residual_enabled"]},
      {title:"Composite Clipper", keys:["mpx_clipper_enabled","mpx_clipper_threshold_db","mpx_clipper_ceiling_db","mpx_clipper_cancel_pilot","mpx_clipper_cancel_rds","mpx_clipper_cancel_stereo","mpx_clipper_cancel_audio","mpx_multiband_clipper_enabled"]},
      {title:"BS.412 Power", keys:["bs412_enabled","bs412_threshold_db","bs412_window_seconds"]},
      {title:"Output / Final Stage", keys:["output_gain_db","final_drive_db","mpx_deviation_khz","limit_mpx","limit_threshold","pilot_level","rds_level"]}
    ]},
  { id:"rds", title:"RDS",
    help:"Station identity and RDS data. Text and flags apply live on air; injection level (Processing > Output) needs a restart. TA forces a 0A group at the edge.",
    cards:[
      {title:"On Air", special:"rdsLive"},
      {title:"Identity", keys:["en_rds","pi","pty","ecc","lic","ptyn","en_ptyn","ptyn_centered"]},
      {title:"Program Service (PS)", keys:["ps_active_bank","ps_a","ps_b","ps_c","ps_d","ps_centered","en_lps","ps_long_32","lps_centered","lps_cr"]},
      {title:"RadioText", keys:["rt_text","rt_centered","rt_cr","en_rt_plus"]},
      {title:"Flags", keys:["tp","ta","ms","di_stereo","di_head","di_comp","di_dyn"]},
      {title:"AF & Clock", keys:["en_af","af_list","en_ct","en_id","pin_enabled","pin_day","pin_hour","pin_minute"]},
      {title:"Groups", keys:["group_sequence"]}
    ]},
  { id:"interfaces", title:"Interfaces",
    help:"Audio devices, sample rate, and output mode. These are restart-class settings: change them, then press Restart. On Linux devices are ALSA PCM names.",
    cards:[
      {title:"Audio Devices", special:"devices"},
      {title:"Format", keys:["sample_rate","processed_audio_output","blocksize"]}
    ]},
  { id:"tone", title:"Test Tone",
    help:"Built-in generator for line-up. Switch Source back to input when done.",
    cards:[
      {title:"Generator", keys:["source_mode","test_tone_type","test_tone_mode","test_tone_freq","test_tone_level_db"]}
    ]},
  { id:"presets", title:"Presets",
    help:"Factory sound presets. Applying one changes several settings at once, live, and records the choice.",
    cards:[{title:"Apply Preset", special:"presets"}]},
  { id:"advanced", title:"Advanced",
    help:"Every configuration key exactly as stored in the INI, applied with the same validation as a file load. Use when a control is not on the stage cards.",
    cards:[{title:"All Settings", special:"rawConfig"}]}
];
SCHEMA["sample_rate"] = { kind:"select", label:"Sample Rate", options:["192000","96000","48000"], sub:"restart" };
SCHEMA["blocksize"] = { kind:"select", label:"Block Size", options:["256","512","1024","2048"], sub:"restart" };

const $ = (id) => document.getElementById(id);
let apiKey = localStorage.getItem("mpxprime_api_key") || "";
let configValues = {};
let presetLists = {};
let currentPage = "processing";

function headers(json) {
  const h = {};
  if (apiKey) h["X-API-Key"] = apiKey;
  if (json) h["Content-Type"] = "application/json";
  return h;
}
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers:{ ...headers(!!opts.body), ...(opts.headers||{}) } });
  if (res.status === 401) { $("keybar").classList.add("show"); throw new Error("unauthorized"); }
  $("keybar").classList.remove("show");
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error?.message || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}
function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.style.borderColor = bad ? "var(--bad)" : "var(--line)";
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2400);
}
const isTrue = (v) => /^(true|yes|1|on)$/i.test(String(v||""));

function renderSidebar() {
  const nav = $("sidebar");
  nav.innerHTML = "";
  for (const p of PAGES) {
    const el = document.createElement("div");
    el.className = "nav";
    el.dataset.page = p.id;
    el.textContent = p.title;
    el.onclick = () => showPage(p.id);
    nav.appendChild(el);
  }
}
function showPage(id) {
  currentPage = id;
  document.querySelectorAll("#sidebar .nav").forEach(n => n.classList.toggle("active", n.dataset.page === id));
  const page = PAGES.find(p => p.id === id);
  const c = $("content");
  c.innerHTML = "";
  c.appendChild(Object.assign(document.createElement("h1"), { textContent: page.title }));
  c.appendChild(Object.assign(document.createElement("div"), { className:"pagehelp", textContent: page.help }));
  const cards = document.createElement("div");
  cards.className = "cards";
  for (const card of page.cards) cards.appendChild(renderCard(card));
  c.appendChild(cards);
  refreshControlValues();
  if (id === "advanced") loadRawConfig();
  if (id === "interfaces") loadDevices();
  if (id === "rds") pollRDS();
}
function renderCard(card) {
  const el = document.createElement("div");
  el.className = "card";
  const h = document.createElement("h2");
  h.textContent = card.title;
  el.appendChild(h);
  if (card.presetKind) h.appendChild(presetPicker(card.presetKind));
  if (card.special === "rdsLive") {
    el.insertAdjacentHTML("beforeend",
      '<div class="rds-live"><div class="ps" id="rdsPS">--------</div><div class="rt" id="rdsRT"></div></div><div class="hint" id="rdsIds"></div>');
    return el;
  }
  if (card.special === "devices") {
    el.insertAdjacentHTML("beforeend",
      '<div class="ctl"><label>Input Device</label><select id="devIn" style="max-width:210px"></select></div>' +
      '<div class="ctl"><label>Output Device</label><select id="devOut" style="max-width:210px"></select></div>' +
      '<div class="hint" id="devNote"></div>' +
      '<div class="hint">Changing a device is a restart-class setting: pick it, then press Restart.</div>');
    return el;
  }
  if (card.special === "presets") {
    el.insertAdjacentHTML("beforeend",
      '<div class="ctl"><label>Kind</label><select id="presetKind"></select></div>' +
      '<div class="ctl"><label>Preset</label><select id="presetId"></select></div>' +
      '<div class="ctl"><label>Intensity (multiband)</label><select id="presetIntensity"><option value="0.5">light</option><option value="1.0" selected>normal</option><option value="1.5">heavy</option></select></div>' +
      '<div style="text-align:right;margin-top:8px"><button class="primary" id="presetApply">Apply Live</button></div>');
    queueMicrotask(wirePresetCard);
    return el;
  }
  if (card.special === "rawConfig") {
    el.appendChild(Object.assign(document.createElement("div"), { id:"configTables" }));
    return el;
  }
  let added = 0;
  for (const key of card.keys || []) {
    const def = SCHEMA[key];
    if (!def) continue;
    el.appendChild(renderControl(key, def));
    added++;
  }
  if (!added) el.appendChild(Object.assign(document.createElement("div"), { className:"hint", textContent:"(no live controls; see Advanced)" }));
  return el;
}
function renderControl(key, def) {
  const row = document.createElement("div");
  row.className = "ctl";
  row.dataset.key = key;
  const label = document.createElement("label");
  label.textContent = def.label;
  if (def.sub) label.insertAdjacentHTML("beforeend", `<span class="sub">${def.sub}</span>`);
  row.appendChild(label);
  if (def.kind === "toggle") {
    const sw = document.createElement("label");
    sw.className = "switch";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.onchange = () => patchKey(key, input.checked ? "True" : "False");
    sw.appendChild(input);
    sw.insertAdjacentHTML("beforeend", '<span class="knob"></span>');
    row.appendChild(sw);
    row._sync = (v) => { input.checked = isTrue(v); };
  } else if (def.kind === "slider") {
    const wrap = document.createElement("div");
    wrap.className = "sliderwrap";
    const input = document.createElement("input");
    input.type = "range";
    input.min = def.min; input.max = def.max; input.step = def.step;
    const val = document.createElement("span");
    val.className = "sval";
    const dec = def.decimals ?? 1;
    const fmtv = (v) => Number(v).toFixed(dec) + (def.unit || "");
    input.oninput = () => { val.textContent = fmtv(input.value); };
    input.onchange = () => patchKey(key, String(input.value));
    wrap.appendChild(input); wrap.appendChild(val);
    row.appendChild(wrap);
    row._sync = (v) => { if (v != null && v !== "") { input.value = v; val.textContent = fmtv(v); } };
  } else if (def.kind === "select") {
    const sel = document.createElement("select");
    for (const o of def.options) sel.appendChild(Object.assign(document.createElement("option"), { value:o, textContent:o + (def.unit||"") }));
    sel.onchange = () => patchKey(key, sel.value);
    row.appendChild(sel);
    row._sync = (v) => { sel.value = String(v); };
  } else if (def.kind === "number") {
    const input = document.createElement("input");
    input.type = "number"; input.min = def.min; input.max = def.max; input.style.width = "70px";
    input.onchange = () => patchKey(key, input.value);
    row.appendChild(input);
    row._sync = (v) => { if (document.activeElement !== input) input.value = v ?? ""; };
  } else {
    const input = document.createElement("input");
    input.type = "text";
    input.onchange = () => patchKey(key, input.value);
    row.appendChild(input);
    row._sync = (v) => { if (document.activeElement !== input) input.value = v ?? ""; };
  }
  return row;
}
function presetPicker(kind) {
  const sel = document.createElement("select");
  sel.style.fontSize = "11px";
  sel.appendChild(Object.assign(document.createElement("option"), { value:"", textContent:"preset..." }));
  for (const id of presetLists[kind] || []) sel.appendChild(Object.assign(document.createElement("option"), { value:id, textContent:id }));
  sel.onchange = async () => {
    if (!sel.value) return;
    try {
      await api("/api/presets", { method:"POST", body:JSON.stringify({ kind, id:sel.value }) });
      toast(kind + " preset '" + sel.value + "' applied live");
      await loadConfigValues(); refreshControlValues();
    } catch (e) { toast("preset failed: " + e.message, true); }
    sel.value = "";
  };
  return sel;
}
function wirePresetCard() {
  const kindSel = $("presetKind");
  if (!kindSel) return;
  kindSel.innerHTML = "";
  for (const k of Object.keys(presetLists).sort()) kindSel.appendChild(Object.assign(document.createElement("option"), { value:k, textContent:k }));
  const fill = () => {
    const idSel = $("presetId");
    idSel.innerHTML = "";
    for (const id of presetLists[kindSel.value] || []) idSel.appendChild(Object.assign(document.createElement("option"), { value:id, textContent:id }));
  };
  kindSel.onchange = fill; fill();
  $("presetApply").onclick = async () => {
    try {
      await api("/api/presets", { method:"POST", body:JSON.stringify({ kind:kindSel.value, id:$("presetId").value, intensity:parseFloat($("presetIntensity").value) }) });
      toast("preset applied live");
      await loadConfigValues(); refreshControlValues();
    } catch (e) { toast("preset failed: " + e.message, true); }
  };
}
async function loadConfigValues() {
  const sections = await api("/api/config");
  configValues = {};
  for (const sec of Object.values(sections)) Object.assign(configValues, sec);
}
function refreshControlValues() {
  document.querySelectorAll(".ctl").forEach(row => {
    if (row._sync && row.dataset.key in configValues) row._sync(configValues[row.dataset.key]);
  });
}
async function patchKey(key, value) {
  try {
    const r = await api("/api/config", { method:"PATCH", body:JSON.stringify({ [key]: value }) });
    const o = r.outcomes[0];
    if (o.effectiveValue != null) configValues[key] = o.effectiveValue;
    const label = { live:"live", liveRDS:"live (RDS)", restartRequired:"saved - needs restart", unchanged:"unchanged" }[o.disposition];
    toast(key + ": " + label);
    if (o.disposition === "unchanged") refreshControlValues();
    pollStatus();
  } catch (e) { toast(key + ": " + e.message, true); }
}
async function loadDevices() {
  try {
    const d = await api("/api/devices");
    const fill = (sel, list, selected) => {
      sel.innerHTML = "";
      sel.appendChild(Object.assign(document.createElement("option"), { value:"", textContent:"(system default)" }));
      for (const dev of list) sel.appendChild(Object.assign(document.createElement("option"), { value:dev.id, textContent:dev.name }));
      sel.value = selected || "";
    };
    fill($("devIn"), d.inputs, d.selectedInput);
    fill($("devOut"), d.outputs, d.selectedOutput);
    $("devNote").textContent = d.note || "";
    $("devIn").onchange = () => patchKey("input_device_uid", $("devIn").value);
    $("devOut").onchange = () => patchKey("output_device_uid", $("devOut").value);
  } catch (e) {}
}
async function loadRawConfig() {
  try {
    const sections = await api("/api/config");
    const host = $("configTables");
    if (!host) return;
    host.innerHTML = "";
    for (const sec of Object.keys(sections).sort()) {
      const keys = Object.keys(sections[sec]).sort();
      if (!keys.length) continue;
      host.insertAdjacentHTML("beforeend", `<div class="section-title">[${sec}]</div>`);
      const table = document.createElement("table");
      table.innerHTML = "<tr><th style='width:42%'>key</th><th>value</th><th style='width:76px'></th></tr>";
      for (const k of keys) {
        const tr = document.createElement("tr");
        const kc = document.createElement("td"); kc.style.fontFamily = "var(--mono)"; kc.textContent = k;
        const vc = document.createElement("td");
        const input = document.createElement("input"); input.type = "text"; input.value = sections[sec][k];
        vc.appendChild(input);
        const bc = document.createElement("td");
        const btn = document.createElement("button"); btn.textContent = "Apply";
        btn.onclick = async () => { await patchKey(k, input.value); if (configValues[k] != null) input.value = configValues[k]; };
        bc.appendChild(btn);
        tr.appendChild(kc); tr.appendChild(vc); tr.appendChild(bc);
        table.appendChild(tr);
      }
      host.appendChild(table);
    }
  } catch (e) {}
}
function levelText(v) { if (v == null) return "-"; if (v <= 0.00001) return "-inf"; return (20*Math.log10(v)).toFixed(1); }
function levelPct(v) { if (v == null || v <= 0.00001) return 0; return Math.max(0, Math.min(100, (20*Math.log10(v)+48)/48*100)); }
const grPct = (db) => db == null ? 0 : Math.max(0, Math.min(100, db/12*100));
const fmt = (v, d=1) => v == null ? "-" : Number(v).toFixed(d);
async function pollStatus() {
  try {
    const s = await api("/api/status");
    $("dot").classList.toggle("on", s.running);
    $("meta").textContent = `${s.platform} v${s.version} | ${(s.sampleRateHz/1000).toFixed(0)} kHz | ${s.sourceMode}`;
    $("restartBadge").hidden = !s.restartPending;
  } catch (e) { $("meta").textContent = "unreachable"; $("dot").classList.remove("on"); }
}
async function pollMeters() {
  let m = null;
  try { m = await api("/api/meters"); } catch (e) {}
  $("mInL").style.height = levelPct(m?.inputLeftPeak) + "%"; $("vInL").textContent = levelText(m?.inputLeftPeak);
  $("mInR").style.height = levelPct(m?.inputRightPeak) + "%"; $("vInR").textContent = levelText(m?.inputRightPeak);
  $("mOut").style.height = levelPct(m?.outputPeak) + "%"; $("vOut").textContent = levelText(m?.outputPeak);
  const agcGR = m?.agcGainDB != null ? Math.max(0,-m.agcGainDB) : null;
  $("mAGC").style.height = grPct(agcGR) + "%"; $("vAGC").textContent = fmt(m?.agcGainDB);
  $("mLim").style.height = grPct(m?.preEncodeLimiterGainReductionDB) + "%"; $("vLim").textContent = fmt(m?.preEncodeLimiterGainReductionDB);
  $("mClip").style.height = grPct(m?.compositeClipperGainReductionDB) + "%"; $("vClip").textContent = fmt(m?.compositeClipperGainReductionDB);
  $("vDev").textContent = fmt(m?.deviationKHzPeak);
  $("devRead").classList.toggle("alert", (m?.deviationKHzPeak||0) > 75);
  $("vPilot").textContent = fmt(m?.pilotInjectionPercent);
  $("vRDSInj").textContent = fmt(m?.rdsInjectionPercent);
  $("vMargin").textContent = fmt(m?.compositeBudgetMarginDB);
}
async function pollRDS() {
  if (currentPage !== "rds") return;
  try {
    const r = await api("/api/rds");
    if ($("rdsPS")) {
      $("rdsPS").textContent = r.livePS || (r.enabled ? "........" : "RDS OFF");
      $("rdsRT").textContent = r.liveRT || "";
      $("rdsIds").textContent = `PI ${r.pi}  PTY ${r.pty}  TP ${r.tp?"on":"off"}  TA ${r.ta?"ON":"off"}`;
    }
  } catch (e) {}
}
async function transport(action) {
  try { await api("/api/transport/" + action, { method:"POST" }); toast("transport: " + action); pollStatus(); }
  catch (e) { toast("transport failed: " + e.message, true); }
}
$("btnStart").onclick = () => transport("start");
$("btnStop").onclick = () => transport("stop");
$("btnRestart").onclick = () => transport("restart");
$("keySave").onclick = () => { apiKey = $("keyInput").value.trim(); localStorage.setItem("mpxprime_api_key", apiKey); boot(); };
async function boot() {
  renderSidebar(); pollStatus(); pollMeters();
  try { presetLists = await api("/api/presets"); await loadConfigValues(); } catch (e) {}
  showPage(currentPage);
}
boot();
setInterval(pollStatus, 2000);
setInterval(pollMeters, 250);
setInterval(pollRDS, 1000);
</script>
